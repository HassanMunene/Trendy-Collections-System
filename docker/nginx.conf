server {
    listen 80;
    server_name _;
    root /app/public;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # API, Sanctum and Laravel's health check go to PHP
    location ^~ /api/    { try_files $uri /index.php?$query_string; }
    location ^~ /sanctum/ { try_files $uri /index.php?$query_string; }
    location = /up       { try_files $uri /index.php?$query_string; }

    # Everything else is the single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets never change, so cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
