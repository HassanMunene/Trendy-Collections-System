services:
  app:
    build: .
    image: trendy-app
    container_name: trendy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Uploaded profile photos live here; without this volume a rebuild starts from an empty folder.
      - trendy_uploads:/app/storage/app/public
    environment:
      APP_NAME: "Trendy Collections"
      APP_ENV: production
      APP_DEBUG: "false"
      # Generate once with: cd backend && php artisan key:generate --show
      APP_KEY: "${APP_KEY:?APP_KEY is required - run php artisan key:generate --show in backend}"
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Bootstrap superadmin, created on first start if absent (see trendy:ensure-superadmin)
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD is required - set an 8+ character password}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-trendy}
      DB_USERNAME: ${POSTGRES_USER:-trendy}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trendy_local_dev}
      SESSION_DRIVER: database
      SESSION_LIFETIME: "720"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: trendy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trendy}
      POSTGRES_USER: ${POSTGRES_USER:-trendy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trendy_local_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - trendy_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trendy} -d ${POSTGRES_DB:-trendy}"]
      interval: 5s
      retries: 10

volumes:
  trendy_pgdata:
  trendy_uploads:
